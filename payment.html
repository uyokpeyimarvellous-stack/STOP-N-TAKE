<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="HTML Project, Payment">
    <meta name="description" content="Payment page for Marvellous' project">
    <meta name="author" content="Marvellous">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="js.js"></script>
</head>

<body>
    <!-- Navigation Menu -->
    <nav class="menu">
    <a href="./index.html"><i class="fas fa-home"></i> Home</a>
    <a href="business.html"><i class="fas fa-briefcase"></i> Business</a>
    <a href="details.html"><i class="fas fa-info-circle"></i> Details</a>
    <a href="payment.html"><i class="fas fa-credit-card"></i> Payment</a>
    <a href="menu.html"><i class="fas fa-utensils"></i> Menu</a>
    </nav>

    <!-- Payment Form -->
    <div class="form-container">
        <form class="form" action="confirmation.html" method="POST">
            <h2>Payment Details</h2>
            <p>Please fill in your payment information below.</p>
            <input type="text" name="cardholder_name" placeholder="Cardholder Name" required>
            <input type="text" name="card_number" placeholder="Card Number" required maxlength="19">
            <input type="date" name="expiry_date" required>
            <input type="number" name="cvv" placeholder="CVV" required min="100" max="999" maxlength="3">
            <div style="display: flex; align-items: center;">
                <span style="font-size: 1.2em; color: #555; margin-right: 8px;">&#8358;</span>
                <input type="number" name="amount" placeholder="Amount to Pay" required min="0" step="0.01" style="flex: 1;">
            </div>
            <button type="submit" class="btn">Submit Payment</button>
        </form>
    </div>
</body>

</html>
